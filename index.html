<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

<title>壁纸实验室 · 纯色壁纸生成器</title>
<meta name="description" content="生成纯色背景与纯色文字的手机壁纸，支持自定义文字、图案与色彩搭配模板。" />
<meta name="theme-color" content="#101014" />

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="壁纸实验室" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />

<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">

  <header class="app__header">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="brand__text">
        <h1 class="brand__title">壁纸实验室</h1>
        <p class="brand__sub">纯色壁纸生成器</p>
      </div>
    </div>
    <button class="icon-btn" id="installBtn" title="安装到主屏幕" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0-0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <span>安装</span>
    </button>
  </header>

  <main class="app__main">

    <!-- 控制面板 -->
    <aside class="panel">

      <!-- 固定配色模板 -->
      <section class="card">
        <h2 class="card__title">配色模板</h2>
        <div class="presets" id="presetGrid"><!-- 动态渲染 --></div>
      </section>

      <!-- 尺寸 -->
      <section class="card">
        <h2 class="card__title">画布尺寸</h2>
        <div class="seg" id="sizeSeg"></div>
      </section>

      <!-- 背景 -->
      <section class="card">
        <h2 class="card__title">背景颜色</h2>
        <div class="color-row">
          <input type="color" id="bgColor" class="color-input" value="#3B5BDB" />
          <div class="swatches" id="bgSwatches"></div>
        </div>
        <div class="field">
          <label class="field__label" for="gradientSel">渐变背景</label>
          <select id="gradientSel" class="select">
            <option value="solid">纯色</option>
            <option value="linear">线性渐变</option>
            <option value="radial">径向渐变</option>
          </select>
        </div>
        <div class="field" id="gradDirWrap" hidden>
          <label class="field__label">渐变方向</label>
          <div class="seg" id="gradDirSeg"></div>
        </div>
        <div class="field" id="bg2Wrap" hidden>
          <label class="field__label">渐变色 2</label>
          <div class="color-row">
            <input type="color" id="bg2" class="color-input" value="#FF6B6B" />
            <div class="swatches" id="bg2Swatches"></div>
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="patternSel">图案装饰</label>
          <select id="patternSel" class="select">
            <option value="none">无</option>
            <option value="dots">圆点</option>
            <option value="lines">斜线</option>
            <option value="grid">网格</option>
            <option value="rings">同心圆</option>
            <option value="diagonal">对角块</option>
          </select>
        </div>
        <div class="field" id="patternColorWrap" hidden>
          <label class="field__label">图案颜色
            <button id="patternAuto" class="link-btn" type="button">自动</button>
          </label>
          <div class="color-row">
            <input type="color" id="patternColor" class="color-input" value="#FFFFFF" />
            <div class="swatches" id="patternSwatches"></div>
          </div>
        </div>
        <div class="field field--inline" id="patternStrengthWrap" hidden>
          <label class="field__label" for="patternStrength">图案透明度</label>
          <input type="range" id="patternStrength" min="0.02" max="0.5" step="0.02" value="0.18" />
        </div>
      </section>

      <!-- 文字 -->
      <section class="card">
        <h2 class="card__title">文字内容</h2>
        <textarea id="textInput" class="textarea" rows="2" placeholder="输入要显示的文字，换行可分段">INSPIRE
MORE</textarea>
        <div class="field">
          <label class="field__label" for="textColor">文字颜色</label>
          <div class="color-row">
            <input type="color" id="textColor" class="color-input" value="#FFFFFF" />
            <div class="swatches" id="textSwatches"></div>
          </div>
          <div class="contrast-badge good" id="contrastBadge"></div>
        </div>
        <div class="grid2">
          <div class="field">
            <label class="field__label" for="fontSize">字号</label>
            <input type="range" id="fontSize" min="20" max="200" step="1" value="110" />
          </div>
          <div class="field">
            <label class="field__label" for="vPos">垂直位置</label>
            <div class="seg seg--small" id="vPosSeg">
              <button data-v="top">上</button>
              <button data-v="middle" class="active">中</button>
              <button data-v="bottom">下</button>
            </div>
          </div>
        </div>
        <div class="field">
          <label class="field__label">样式</label>
          <div class="seg seg--small" id="styleSeg">
            <button data-s="normal" class="active">常规</button>
            <button data-s="bold">粗体</button>
            <button data-s="italic">斜体</button>
          </div>
        </div>
        <div class="field">
          <label class="field__label" for="letterSpacing">字间距</label>
          <input type="range" id="letterSpacing" min="0" max="80" step="1" value="12" />
        </div>
      </section>

    </aside>

    <!-- 预览区（置底） -->
    <section class="stage">
      <div class="phone-wrap" id="phoneWrap">
        <canvas id="preview" class="preview-canvas" aria-label="壁纸预览"></canvas>
      </div>
      <div class="stage__actions">
        <button class="btn btn--primary" id="downloadBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          下载当前尺寸
        </button>
      </div>
      <div class="stage__actions stage__actions--split">
        <button class="btn btn--ghost" id="allBtn" title="一键导出全部 6 种尺寸，打包为 zip">导出全部尺寸</button>
        <button class="btn btn--ghost" id="shuffleBtn">随机灵感</button>
      </div>
    </section>
  </main>

  <footer class="app__footer">
    <p>纯色即态度 · 文字即宣言。用 Safari 打开本站可"添加到主屏幕"，随时离线使用。</p>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>
<script src="js/app.js"></script>
</body>
</html>
